l_simp_chinese:
 zz_br_fill_jobs_decision: "补岗迁移"
 zz_br_fill_jobs_decision_desc: "自动从帝国其它殖民地调集平民/维护子个体（居民类人口）迁入本星球填补空缺岗位，直到岗位补齐、源星球耗尽或资金不足为止。\n\n§E仅迁移居民类人口，失业人口与在岗人口不受影响。费用按原版标准从国库扣除（每 100 人口 = 100 能量 + 10 凝聚力）。§!"
 zz_br_excess_decision: "超额迁移"
 zz_br_excess_decision_desc: "将帝国一颗平民人口较多的源星球上的全部平民迁入本星球（近似选取平民最多的星球，加权随机，非数学保证）。若本星球存在空缺岗位，会先按「补岗迁移」的规则补岗，再执行上述迁入；无空岗时则直接迁入。\n\n§E费用按原版标准扣除（每 100 人口 = 100 能量 + 10 凝聚力）。§!"
 zz_br_full_decision: "完全迁移"
 zz_br_full_decision_desc: "将帝国其它所有殖民地中的平民/维护子个体全部迁入本星球，不设岗位或住房上限；国库不足以继续支付时提前停止。\n\n§E可能造成失业与住房不足。费用按原版标准从国库扣除。§!"
 zz_br_fail_no_jobs: "本星球没有空缺岗位。"
 zz_br_fail_policy: "当前迁移政策不允许强制迁移。"
 zz_br_fail_no_source: "帝国其它殖民地没有可调集的平民/维护子个体。"
 zz_br_ok: "好"
 zz_br_fill_title: "补岗迁移"
 zz_br_excess_title: "超额迁移"
 zz_br_full_title: "完全迁移"
 zz_br_0_desc: "本星球当前没有空缺岗位。"
 zz_br_1_desc: "已从其它殖民地调集平民/维护子个体迁入，本星球的空缺岗位已全部补齐。"
 zz_br_2_desc: "本星球仍有空缺岗位，但帝国其它殖民地已没有可调集的平民/维护子个体（或源星球正被轰炸/发生地面战斗而无法调集）。"
 zz_br_3_desc: "国库的能量或凝聚力不足以按原版标准支付剩余迁移费用，本次补岗提前结束。"
 zz_br_4_desc: "补岗迁移已停止，本星球可能仍有空缺岗位。请检查源星球是否仍存在可调集的居民类人口。"
 zz_br_11_desc: "如有空缺岗位已先补齐，且已将选中的源星球上的平民全部迁入本星球。"
 zz_br_12_desc: "补岗已完成或已尽最大努力，但帝国其它殖民地没有可再额外调集的平民/维护子个体。"
 zz_br_13_desc: "国库的能量或凝聚力不足以支付剩余迁移费用，超额迁移提前结束。"
 zz_br_21_desc: "已将帝国其它殖民地中全部可调集的平民/维护子个体迁入本星球。"
 zz_br_22_desc: "帝国其它殖民地当前没有可调集的平民/维护子个体。"
 zz_br_23_desc: "国库的能量或凝聚力不足以支付剩余迁移费用，完全迁移提前结束，仍有部分平民留在其它殖民地。"
